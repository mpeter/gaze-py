name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.2.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Never cancel a release mid-publish; partial uploads cannot be undone.

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate tag format
        run: |
          if ! echo "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid tag format: '$RELEASE_TAG'. Must match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "Tag format valid: $RELEASE_TAG"

      - name: Check tag uniqueness
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${RELEASE_TAG}$"; then
            echo "::error::Tag '$RELEASE_TAG' already exists."
            exit 1
          fi
          echo "Tag '$RELEASE_TAG' is available."

      - name: Verify version matches tag
        run: |
          TAG_VER="${RELEASE_TAG#v}"

          PROJ_VER=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          print(d['project']['version'])
          ")
          if [ "$PROJ_VER" != "$TAG_VER" ]; then
            echo "::error::pyproject.toml version ($PROJ_VER) does not match tag ($TAG_VER)."
            echo "Bump the version in pyproject.toml and src/gaze_py/__init__.py first."
            exit 1
          fi
          echo "pyproject.toml version match: $PROJ_VER"

          INIT_VER=$(python3 -c "
          import ast, pathlib
          tree = ast.parse(pathlib.Path('src/gaze_py/__init__.py').read_text())
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign):
                  for t in node.targets:
                      if isinstance(t, ast.Name) and t.id == '__version__':
                          print(ast.literal_eval(node.value))
          ")
          if [ "$INIT_VER" != "$TAG_VER" ]; then
            echo "::error::__init__.py __version__ ($INIT_VER) does not match tag ($TAG_VER)."
            echo "Bump __version__ in src/gaze_py/__init__.py to match."
            exit 1
          fi
          echo "__init__.py version match: $INIT_VER"

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.21"

      - name: Run test suite
        run: uv run pytest --cov=gaze_py --cov-fail-under=85

  publish:
    needs: [preflight, test]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/gaze-py
    permissions:
      id-token: write
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.21"

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          packages-dir: dist/
          skip-existing: false

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Smoke test published package
        run: |
          VER="${RELEASE_TAG#v}"
          for i in 1 2 3 4 5; do
            sleep 30
            if uvx --from "gaze-py==${VER}" gazepy --version 2>/dev/null | grep -q "${VER}"; then
              echo "Smoke test passed: gaze-py ${VER} is available on PyPI."
              exit 0
            fi
            echo "Attempt $i: not yet available, retrying in 30s..."
          done
          echo "::error::Smoke test timed out after 150s — verify manually at https://pypi.org/p/gaze-py"
          exit 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${RELEASE_TAG#v}"
          # Extract the [0.x.y] section from CHANGELOG.md for release notes.
          # Prints lines between the matching version header and the next ## header.
          NOTES=$(awk "/^## \[${VER}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          gh release create "$RELEASE_TAG" \
            --title "gaze-py ${RELEASE_TAG}" \
            --notes "${NOTES}" \
            dist/*.whl dist/*.tar.gz
