name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.2.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate tag format
        run: |
          if ! echo "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid tag format: '$RELEASE_TAG'. Must match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "Tag format valid: $RELEASE_TAG"

      - name: Check tag uniqueness
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${RELEASE_TAG}$"; then
            echo "::error::Tag '$RELEASE_TAG' already exists."
            exit 1
          fi
          echo "Tag '$RELEASE_TAG' is available."

      - name: Verify version matches tag
        run: |
          TAG_VER="${RELEASE_TAG#v}"
          PROJ_VER=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          print(d['project']['version'])
          ")
          if [ "$PROJ_VER" != "$TAG_VER" ]; then
            echo "::error::pyproject.toml version ($PROJ_VER) does not match tag ($TAG_VER)."
            echo "Bump the version in pyproject.toml and src/gaze_py/__init__.py first."
            exit 1
          fi
          echo "Version match confirmed: $PROJ_VER"

  publish:
    needs: preflight
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/gaze-py
    permissions:
      id-token: write
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.21"

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@6733eb7d741f0b11ec6a39b58540dab7590f9b7d  # v1.14.0
