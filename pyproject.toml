[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gaze-py"
version = "0.4.1"
description = "Python-native GazeCRAP analysis engine"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{name = "Unbound Force"}]
keywords = ["crap", "gaze", "cyclomatic-complexity", "ast", "code-quality", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.0,<9",
    "pyyaml>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/mpeter/gaze-py"
Repository = "https://github.com/mpeter/gaze-py"
"Bug Tracker" = "https://github.com/mpeter/gaze-py/issues"

[project.scripts]
gazepy = "gaze_py.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/gaze_py"]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["tests/testdata"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "PL"]
ignore = [
    "PLR0913",   # too-many-arguments — enforced by review, not as hard error
    "PLR2004",   # magic value in comparison — exit code constants are unambiguous
    "PLC0415",   # import not at top-level — inline imports documented at site
    "TRY003",    # long exception messages — domain errors need context
    "EM101",     # string literal in raise — domain errors need context
    "EM102",     # f-string in raise — domain errors need context
]

# ---------------------------------------------------------------------------
# Mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# types-pyyaml stubs are installed but mypy may not locate them in some
# environments. Suppress the import-untyped error for yaml only.
module = "yaml"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["tests/testdata"]
addopts = "-ra --cov=gaze_py --cov-fail-under=85"
markers = [
    "slow: marks tests as slow integration tests (deselect with '-m not slow')",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["gaze_py"]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260518",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.10",
]
