[project]
name = "gaze-py"
version = "0.1.0"
description = "Python-native GazeCRAP analysis engine for contract-aware test quality gates"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Jay Flowers" }]
readme = "README.md"
keywords = ["testing", "static-analysis", "code-quality", "crap-score", "side-effects", "test-coverage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "coverage>=7.0",
    "jsonschema>=4.18",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/unbound-force/gaze-py"
Repository = "https://github.com/mpeter/gaze-py"
Issues = "https://github.com/mpeter/gaze-py/issues"
Changelog = "https://github.com/mpeter/gaze-py/blob/main/CHANGELOG.md"

[project.scripts]
gazepy = "gaze_py.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.11",
    "mypy>=1.15",
    "types-jsonschema>=4.23.0.20250516",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
backend-path = []
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaze_py"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]
# Intentionally broken fixture for SC-012 (GazeParseError on syntax error).
exclude = ["tests/testdata/analysis/syntax_error.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/testdata"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
]

[tool.mypy]
strict = true
