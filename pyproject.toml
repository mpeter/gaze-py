[project]
name = "gaze-py"
version = "0.1.0"
description = "Python-native GazeCRAP analysis engine for contract-aware test quality gates"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Jay Flowers" }]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
gaze-py = "gaze_py.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.11",
    "mypy>=1.15",
    "jsonschema>=4.18",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
backend-path = []
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaze_py"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]
# Intentionally broken fixture for SC-012 (GazeParseError on syntax error).
exclude = ["tests/testdata/analysis/syntax_error.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]

[tool.mypy]
strict = true
