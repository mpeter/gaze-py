name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.2.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Never cancel a release mid-publish; partial uploads cannot be undone.

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag format
        run: |
          if ! echo "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid tag format: '$RELEASE_TAG'. Must match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "Tag format valid: $RELEASE_TAG"

      - name: Check tag uniqueness
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${RELEASE_TAG}$"; then
            echo "::error::Tag '$RELEASE_TAG' already exists."
            exit 1
          fi
          echo "Tag '$RELEASE_TAG' is available."

      - name: Verify version matches tag
        run: |
          TAG_VER="${RELEASE_TAG#v}"

          PROJ_VER=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          print(d['project']['version'])
          ")
          if [ "$PROJ_VER" != "$TAG_VER" ]; then
            echo "::error::pyproject.toml version ($PROJ_VER) does not match tag ($TAG_VER)."
            echo "Bump the version in pyproject.toml and src/gaze_py/__init__.py first."
            exit 1
          fi
          echo "pyproject.toml version match: $PROJ_VER"

          INIT_VER=$(python3 -c "
          import ast, pathlib
          tree = ast.parse(pathlib.Path('src/gaze_py/__init__.py').read_text())
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign):
                  for t in node.targets:
                      if isinstance(t, ast.Name) and t.id == '__version__':
                          print(ast.literal_eval(node.value))
          ")
          if [ "$INIT_VER" != "$TAG_VER" ]; then
            echo "::error::__init__.py __version__ ($INIT_VER) does not match tag ($TAG_VER)."
            echo "Bump __version__ in src/gaze_py/__init__.py to match."
            exit 1
          fi
          echo "__init__.py version match: $INIT_VER"

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.21"

      - name: Run test suite
        run: uv run pytest --cov=gaze_py --cov-fail-under=85

  publish:
    needs: [preflight, test]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/gaze-py
    permissions:
      id-token: write
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.21"

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
        with:
          packages-dir: dist/
          skip-existing: false

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${RELEASE_TAG#v}"
          # Extract the [0.x.y] section from CHANGELOG.md for release notes.
          # Prints lines between the matching version header and the next ## header.
          NOTES=$(awk "/^## \[${VER}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          gh release create "$RELEASE_TAG" \
            --title "gaze-py ${RELEASE_TAG}" \
            --notes "${NOTES}" \
            dist/*.whl dist/*.tar.gz

      - name: Smoke test published package
        run: |
          VER="${RELEASE_TAG#v}"
          # Capture stderr rather than discarding it. Discarding made every
          # failure look like PyPI propagation lag: `gazepy --version` did not
          # exist until 0.9.2, so this step failed on every release with a
          # "timed out after 300s" message that pointed at the CDN instead of
          # at the missing option.
          for i in $(seq 1 10); do
            sleep 30
            if out=$(uvx --refresh --from "gaze-py==${VER}" gazepy --version 2>&1); then
              if printf '%s' "$out" | grep -q "${VER}"; then
                echo "Smoke test passed: gaze-py ${VER} is available on PyPI and reports its version."
                exit 0
              fi
              echo "::error::Published gaze-py ${VER} ran but did not report ${VER}: ${out}"
              exit 1
            fi
            echo "Attempt $i: not yet available, retrying in 30s..."
            last_error="$out"
          done
          echo "::error::Smoke test timed out after 300s — last error: ${last_error:-none}"
          echo "Verify manually at https://pypi.org/p/gaze-py"
          exit 1
